name = "council-spend-monitor"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages will use this when we migrate hosting from Vercel.
# Until then, only the D1 binding below is used (by `wrangler d1 execute`
# and the eventual Pages runtime).
pages_build_output_dir = ".vercel/output/static"

# ---------------------------------------------------------------------------
# Cloudflare D1 binding
# ---------------------------------------------------------------------------
# After running `npx wrangler d1 create council-spend`, paste the printed
# database_id here (and into the GitHub Actions repo secret D1_DATABASE_ID).
# The binding name "DB" is what the Next.js app will read at runtime via
# `getRequestContext().env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "council-spend"
database_id = "e1775f4f-2c8c-40c8-bc31-5b09ba536313"
