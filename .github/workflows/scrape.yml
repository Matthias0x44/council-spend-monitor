name: Refresh council data in D1
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      slug:
        description: Council slug (empty means all registered English councils)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: council-d1-import
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          COUNCIL_SLUG: ${{ inputs.slug }}
        run: node scripts/workflow-matrix.mjs
  import:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: e1775f4f-2c8c-40c8-bc31-5b09ba536313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh published sources directly in D1
        env:
          COUNCIL_SLUGS: ${{ matrix.slugs }}
        run: npm run pipeline:d1 -- --slugs "$COUNCIL_SLUGS"
      - name: Retain import and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-d1-${{ matrix.id }}-${{ github.run_number }}
          path: data/reports/
          retention-days: 30
  audit:
    needs: import
    if: always()
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/d1-quarantine.mjs --apply
      - run: node scripts/d1-coverage.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-d1-coverage-${{ github.run_number }}
          path: data/reports/
          retention-days: 30
# Bounded serial groups let every council run even when an earlier group fails.
# Each file is validated before an atomic source replacement; no local DB copy.
